version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: followup_postgres
    environment:
      POSTGRES_USER: followup_user
      POSTGRES_PASSWORD: followup_pass
      POSTGRES_DB: followup_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
